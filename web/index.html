<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="岩手県山田町の観光、交通、くらしを、町や地域の団体・事業者の資料から調べる案内です。">
    <meta name="theme-color" content="#f5f7f3">
    <title>やまだ案内 | 岩手県山田町の観光とくらし</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="masthead">
      <div class="wrap masthead-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div><strong>やまだ案内</strong><small>岩手県山田町</small></div>
        </div>
        <p id="mode" class="mode" hidden></p>
      </div>
    </header>

    <main class="wrap">
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <h1 id="page-title">山田町のことを、<br>聞いてみる。</h1>
          <p>岩手県山田町の観光、交通、くらしの情報を、出典付きで調べられます。</p>
        </div>
        <figure>
          <img src="/yamada-bay.webp" width="1200" height="900" alt="山田湾の向こうに山が連なる山田港の風景">
          <figcaption>山田湾・山田港</figcaption>
        </figure>
      </section>

      <div class="workspace">
        <div class="primary">
          <form id="question-form" class="panel composer">
            <label for="question" class="panel-title">質問する</label>
            <textarea id="question" name="question" rows="3" maxlength="400" required
              placeholder="例　鯨と海の科学館は何時まで開いていますか？"></textarea>
            <div class="form-actions">
              <span class="shortcut" aria-hidden="true">Ctrl / ⌘ + Enter</span>
              <button type="submit" id="submit" class="primary-button">
                <span class="search-icon" aria-hidden="true"></span><span id="submit-label">資料を検索</span>
              </button>
            </div>
            <p id="status" class="status" role="status" hidden></p>
            <p id="error" class="error" role="alert" hidden></p>
            <noscript><p class="error">質問するには、ブラウザーでJavaScriptを有効にしてください。</p></noscript>
          </form>

          <section id="results" class="panel results" aria-labelledby="result-title" hidden>
            <div class="result-heading">
              <h2 id="result-title" class="panel-title" tabindex="-1">検索結果</h2>
              <button id="copy" type="button" class="secondary-button" hidden>AIに渡す内容をコピー</button>
            </div>
            <p id="result-question" class="result-question"></p>
            <p id="notice" class="notice" hidden></p>
            <p id="answer" class="answer" hidden></p>
            <div id="sources" class="sources"></div>
            <label id="copy-fallback" class="copy-fallback" hidden>
              コピー用の質問と資料
              <textarea id="prompt-text" rows="6" readonly></textarea>
            </label>
            <p id="copy-status" class="status" role="status" hidden></p>
          </section>
        </div>

        <aside class="panel examples" aria-labelledby="examples-title">
          <h2 id="examples-title" class="panel-title">質問例</h2>
          <section class="example-group" aria-labelledby="tourism-title">
            <h3 id="tourism-title" class="category tourism">観光</h3>
            <ul>
              <li><button type="button" class="example">鯨と海の科学館の入館料は？</button></li>
              <li><button type="button" class="example">道の駅やまだは何時まで開いてる？</button></li>
              <li><button type="button" class="example">織笠駅に駐車場はありますか？</button></li>
            </ul>
          </section>
          <section class="example-group" aria-labelledby="life-title">
            <h3 id="life-title" class="category life">くらし</h3>
            <ul>
              <li><button type="button" class="example">ペットボトルのふたはどう出す？</button></li>
              <li><button type="button" class="example">粗大ごみの収集はどう予約する？</button></li>
              <li><button type="button" class="example">山田郵便局のATMは土曜日何時まで？</button></li>
            </ul>
          </section>
        </aside>
      </div>
    </main>

    <footer class="wrap footer">
      <p>公式資料を参照する学習用の試作です。<a href="https://www.town.yamada.iwate.jp/" target="_blank" rel="noopener">山田町公式サイト</a></p>
      <p>写真　<a href="https://commons.wikimedia.org/wiki/File:Port_yamada_20130601.JPG" target="_blank" rel="noopener">Opqr / Wikimedia Commons</a>、2013年・縮小表示。<a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a></p>
    </footer>
  </body>
</html>
