<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="description" content="岩手県山田町の観光、交通、くらしを、地域の資料から調べる案内です。">
    <meta name="theme-color" content="#edf4f1">
    <title>やまだ案内 | 岩手県山田町の観光とくらし</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="app">
      <header class="site-header">
        <div class="wide header-inner">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true"></span>
            <div><strong>やまだ案内</strong><small>岩手県山田町</small></div>
          </div>
          <div id="chat-header" class="header-actions" hidden>
            <p id="mode" class="mode" hidden></p>
          </div>
        </div>
      </header>

      <main id="entry-screen" class="guide">
        <div class="scroll-region">
          <section class="welcome wide" aria-labelledby="page-title">
            <div class="welcome-copy">
              <h1 id="page-title">
                <span class="title-line"><span>山田町のことを、</span></span>
                <span class="title-line"><span>聞いてみる。</span></span>
              </h1>
              <p>観光や交通、くらしの疑問に、<br class="desktop-break">地域の資料をもとにお答えします。</p>
            </div>
            <figure class="place">
              <img src="/yamada-bay.webp" width="1200" height="900" alt="山田湾の向こうに山が連なる山田港の風景">
              <figcaption>
                <span>山田湾・山田港</span>
                <span class="credit"><a href="https://commons.wikimedia.org/wiki/File:Port_yamada_20130601.JPG" target="_blank" rel="noopener">Opqr</a> /
                  <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a></span>
              </figcaption>
            </figure>
          </section>
        </div>

        <section class="composer-area entry-dock" aria-labelledby="entry-title">
          <div class="dock-inner wide">
            <div class="dock-intro">
              <h2 id="entry-title">案内をはじめる</h2>
              <p>チャット画面でお呼びする名前を入力してください。</p>
            </div>
            <form id="entry-form" class="entry-form">
              <label for="nickname">ニックネーム</label>
              <div class="entry-input-row">
                <input id="nickname" type="text" maxlength="24" autocomplete="nickname" required
                  placeholder="例　なぎ" aria-describedby="entry-error">
                <button type="submit" class="enter-button" disabled>案内へ進む <span aria-hidden="true">→</span></button>
              </div>
              <p id="entry-error" class="form-error" role="alert" hidden></p>
              <noscript><p class="form-error">案内をはじめるにはJavaScriptを有効にしてください。</p></noscript>
            </form>
          </div>
        </section>
      </main>

      <main id="chat-screen" class="chat-screen" hidden>
        <aside class="chat-rail" aria-label="会話の操作">
          <button id="new-chat" type="button" class="new-chat">
            <span class="plus" aria-hidden="true"></span>新しい会話
          </button>
          <div class="chat-rail-bottom">
            <p id="profile-name" class="profile-name"></p>
            <button id="back-to-entry" type="button" class="quiet-button">案内の入口へ戻る</button>
          </div>
        </aside>
        <div class="guide">
          <div class="chat-timeline">
            <div id="scroll-region" class="scroll-region">
              <section id="welcome" class="chat-welcome content" aria-labelledby="chat-heading">
                <span class="brand-mark" aria-hidden="true"></span>
                <h1 id="chat-heading" tabindex="-1"><span id="greeting-name"></span>さん、こんにちは。</h1>
                <p>山田町について、何を知りたいですか？</p>
                <div class="examples" aria-label="質問例">
                  <button class="example" type="button" data-question="鯨と海の科学館の大人の入館料は？">科学館の入館料</button>
                  <button class="example" type="button" data-question="大沢のプラスチックの収集日は？">ごみの収集日</button>
                  <button class="example" type="button" data-question="道の駅やまだは何時まで開いてる？">道の駅の営業時間</button>
                  <button class="example" type="button" data-question="粗大ごみの収集はどう予約する？">粗大ごみの予約</button>
                </div>
              </section>
              <section id="conversation" class="conversation content" aria-label="会話" hidden></section>
            </div>
            <button id="jump-latest" class="jump-latest" type="button" aria-controls="conversation" hidden>
              <span aria-hidden="true">↓</span> 最新のメッセージへ
            </button>
          </div>

          <div class="composer-area chat-dock">
            <div class="content">
              <form id="question-form" class="composer">
                <label class="visually-hidden" for="question">山田町について質問する</label>
                <div id="follow-up" class="follow-up" hidden>
                  <span>地区の確認に返信</span>
                  <button id="skip-follow-up" class="quiet-button" type="button">別の質問へ</button>
                </div>
                <div class="input-row">
                  <textarea id="question" name="question" rows="1" maxlength="400" required
                    placeholder="山田町について質問する"></textarea>
                  <button id="submit" class="send-button" type="submit" aria-label="質問を送信" title="質問を送信" disabled>
                    <span class="send-icon" aria-hidden="true"></span>
                  </button>
                  <button id="stop" class="send-button stop-button" type="button" aria-label="回答を停止" title="回答を停止" hidden>
                    <span class="stop-icon" aria-hidden="true"></span>
                  </button>
                </div>
                <p id="form-error" class="form-error" role="alert" hidden></p>
              </form>
              <p class="composer-foot">
                <span>学習用の試作です。最新情報は出典をご確認ください。</span>
                <a href="https://www.town.yamada.iwate.jp/" target="_blank" rel="noopener">山田町公式サイト <span aria-hidden="true">↗</span></a>
              </p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
