<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="description" content="岩手県山田町の観光、交通、くらしを、地域の資料から調べる案内です。">
    <meta name="theme-color" content="#edf4f1">
    <title>やまだ案内 | 岩手県山田町の観光とくらし</title>
    <style>
:root {
  color-scheme: light;
  --paper: #f2f6f2;
  --surface: #fffefa;
  --ink: #183530;
  --muted: #526963;
  --line: #d2dfd9;
  --teal: #176555;
  --teal-dark: #104b3d;
  --dock: #12362f;
  --dock-input: #1c463c;
  --dock-ink: #f0f8ef;
  --dock-muted: #bbd3c7;
  --accent: #aee4cf;
  --motion-out: cubic-bezier(.2, .75, .25, 1);
  font: 100%/1.65 "Noto Sans CJK JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  color: var(--ink);
  background: var(--paper);
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body, figure, p, h1, h2, h3 { margin: 0; }
button, input, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
a { color: var(--teal-dark); text-underline-offset: .22em; }
:focus-visible { outline: 2px solid #28816d; outline-offset: 3px; }

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  clip-path: inset(50%);
  overflow: hidden;
  white-space: nowrap;
}
.app {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
  height: 100dvh;
  background: var(--paper);
  color: var(--ink);
}
.app.in-chat {
  color-scheme: dark;
  --paper: #122a26;
  --surface: #1c3731;
  --ink: #f0f7f1;
  --muted: #aec6ba;
  --line: #3c5a50;
  --teal: #82cdb0;
  --teal-dark: #b9efd7;
}
.wide { width: min(100% - 7rem, 72rem); margin-inline: auto; }
.content { width: min(100% - 3rem, 46rem); margin-inline: auto; }
.site-header { border-bottom: 1px solid var(--line); }
.header-inner { display: flex; min-height: 5.1rem; justify-content: space-between; align-items: center; gap: .9rem; }
.brand { display: flex; align-items: center; gap: .72rem; line-height: 1.3; }
.brand strong { display: block; font-size: 1.09rem; letter-spacing: .055em; }
.brand small { display: block; margin-top: .24rem; color: var(--muted); font-size: .72rem; }
.brand-mark, .guide-mark {
  display: grid;
  place-items: center;
  color: #104b3d;
  background: var(--accent);
  width: 2.55rem;
  height: 2.55rem;
  border-radius: .78rem;
  flex: none;
}
.brand-mark::before, .guide-mark::before {
  content: "";
  width: 1.2rem;
  height: .82rem;
  border-block: 2px solid currentColor;
  border-radius: 48%;
  transform: rotate(-23deg);
}
.header-actions { display: flex; align-items: center; gap: .7rem 1.15rem; }
.mode {
  display: inline-flex;
  align-items: center;
  gap: .45rem;
  white-space: nowrap;
  color: var(--teal-dark);
  font-size: .78rem;
  font-weight: 680;
}
.mode::before { content: ""; width: .44rem; height: .44rem; border-radius: 50%; background: #3c8d72; }
.new-chat {
  display: flex;
  align-items: center;
  gap: .48rem;
  min-height: 2.65rem;
  padding: .42rem .66rem;
  border: 1px solid var(--line);
  border-radius: .55rem;
  color: var(--ink);
  background: var(--surface);
  font-size: .78rem;
  font-weight: 680;
  white-space: nowrap;
}
.new-chat:hover { background: #2a4c42; }
.plus { position: relative; width: .78rem; height: .78rem; flex: none; }
.plus::before, .plus::after {
  content: "";
  position: absolute;
  inset: calc(50% - 1px) 0;
  border-radius: 2px;
  background: currentColor;
}
.plus::after { transform: rotate(90deg); }

.guide { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
.scroll-region {
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-gutter: stable both-edges;
  background: radial-gradient(ellipse at 69% 65%, #d1e8e5 0, #e7f1eb 42%, transparent 73%);
}
.welcome {
  min-height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1.22fr) minmax(0, .88fr);
  align-items: center;
  gap: clamp(1.1rem, 4vw, 4.2rem);
  padding-block: clamp(1.75rem, 6vh, 4.3rem);
}
.welcome-copy h1 {
  font-family: "Noto Serif CJK JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: clamp(2.7rem, 5.15vw, 5rem);
  font-weight: 710;
  line-height: 1.19;
  letter-spacing: -.055em;
}
.title-line, .title-line > span { display: block; }
.welcome-copy > p { margin-top: 1.22rem; color: var(--muted); font-size: clamp(.91rem, 1.45vw, 1.15rem); }
.place {
  margin: 0;
  overflow: hidden;
  border: 1px solid #d2e3db;
  border-radius: 1.15rem;
  background: #f9fcf8;
  box-shadow: 0 16px 36px #173b3819;
}
.place img { display: block; width: 100%; height: auto; aspect-ratio: 1.58; object-fit: cover; object-position: 50% 44%; }
.place figcaption {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  column-gap: .55rem;
  padding: .47rem .72rem;
  color: var(--muted);
  font-size: .74rem;
}
.credit { font-size: .67rem; }
.credit a { color: inherit; }

.in-chat .header-inner { width: calc(100% - 2.25rem); min-height: 4rem; }
.chat-screen { display: grid; grid-template-columns: 12.8rem minmax(0, 1fr); min-height: 0; }
.chat-rail {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: .7rem;
  min-width: 0;
  padding: .95rem .8rem .8rem;
  background: #172f2a;
  border-inline-end: 1px solid var(--line);
}
.chat-rail-bottom { display: grid; gap: .35rem; padding-top: .65rem; border-top: 1px solid var(--line); }
.profile-name { padding-inline: .43rem; font-size: .84rem; font-weight: 700; overflow-wrap: anywhere; }
.chat-rail-bottom .quiet-button { justify-self: start; text-align: left; }
.chat-timeline {
  position: relative;
  display: grid;
  grid-template-rows: minmax(0, 1fr);
  min-height: 0;
}
.jump-latest {
  position: absolute;
  bottom: .72rem;
  left: 50%;
  transform: translateX(-50%);
  padding: .34rem .7rem;
  border: 1px solid var(--line);
  border-radius: 1.4rem;
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 5px 16px #08241b77;
  font-size: .77rem;
  font-weight: 670;
  white-space: nowrap;
}
.jump-latest:hover { border-color: var(--accent); }
.chat-screen .scroll-region {
  background: radial-gradient(ellipse at 53% 50%, #234942 0, #17332e 47%, transparent 76%);
}
.in-conversation #scroll-region { background: var(--paper); }
.chat-welcome {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  min-height: 100%;
  padding-block: 1.45rem;
}
.chat-welcome h1 {
  margin-top: 1.1rem;
  font-size: clamp(2rem, 4.65vw, 3.7rem);
  font-weight: 720;
  letter-spacing: -.045em;
  line-height: 1.24;
  overflow-wrap: anywhere;
}
#greeting-name { color: var(--accent); }
.chat-welcome > p { margin-top: .57rem; color: var(--muted); font-size: clamp(.92rem, 2vw, 1.13rem); }
.chat-welcome .examples { margin-top: 1.22rem; }

.conversation { display: grid; gap: 1.95rem; padding-block: 1.8rem 2.1rem; }
.turn { display: grid; gap: .95rem; min-width: 0; }
.user-message {
  justify-self: end;
  min-width: 0;
  max-width: min(85%, 33rem);
  padding: .62rem .95rem;
  border-radius: .96rem .96rem .28rem .96rem;
  color: #e8f8ee;
  background: #2c5548;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.guide-message { display: grid; grid-template-columns: 2.05rem minmax(0, 1fr); align-items: start; gap: .72rem; }
.guide-mark { width: 2.05rem; height: 2.05rem; border-radius: .65rem; }
.guide-mark::before { width: .95rem; height: .68rem; }
.message-label { margin: .24rem 0 .43rem; font-size: .84rem; font-weight: 760; }
.message-content { font-size: .98rem; line-height: 1.85; overflow-wrap: anywhere; }
.message-content > * + * { margin-top: .62rem; }
.message-content p { white-space: pre-line; }
.message-content .streaming-answer { white-space: pre-wrap; }
.streaming-answer::after {
  content: "";
  display: inline-block;
  width: .18em;
  height: .92em;
  margin-inline-start: .16em;
  vertical-align: -.09em;
  border-radius: .1em;
  background: var(--accent);
}
.message-content h3 { font-size: 1.05rem; line-height: 1.5; }
.message-content ul, .message-content ol { margin-bottom: 0; padding-left: 1.4rem; }
.message-content li + li { margin-top: .2rem; }
.message-content code { padding: .1rem .24rem; border-radius: .25rem; background: #294b40; }
.message-content .notice, .message-content .stopped { color: var(--muted); font-size: .87rem; }
.message-status { display: flex; align-items: center; gap: .65rem; color: var(--muted); font-size: .87rem; }
.activity-dots { display: inline-flex; align-items: center; gap: .17rem; flex: none; }
.activity-dots > span { width: .29rem; height: .29rem; border-radius: 50%; background: var(--teal); }

.message-tools { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .6rem; margin-top: .55rem; }
.quiet-button, .sources > summary {
  min-height: 2rem;
  border: 1px solid transparent;
  border-radius: .38rem;
  background: transparent;
  color: var(--teal-dark);
  padding: .16rem .44rem;
  font-size: .79rem;
  font-weight: 710;
  line-height: 1.5;
}
.quiet-button:hover, .sources > summary:hover { border-color: var(--line); background: #2a4c42; }
.copy-status { color: var(--muted); font-size: .78rem; }
.answer-photos {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: .65rem;
  margin-top: .88rem;
}
.answer-photo {
  overflow: hidden;
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: .82rem;
  background: var(--surface);
}
.answer-photo:only-child { grid-column: 1 / -1; max-width: 28rem; }
.answer-photo img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 3 / 2;
  background: var(--paper);
  object-fit: contain;
}
.answer-photo figcaption { padding: .48rem .69rem .57rem; line-height: 1.5; }
.answer-photo figcaption strong { display: block; font-size: .87rem; }
.answer-photo-meta { display: block; margin-top: .1rem; color: var(--muted); font-size: .73rem; overflow-wrap: anywhere; }
.sources { margin-top: .72rem; }
.sources > summary {
  display: flex;
  align-items: center;
  gap: .45rem;
  width: fit-content;
  cursor: pointer;
  border-color: var(--line);
  background: var(--surface);
  list-style: none;
}
.sources > summary::-webkit-details-marker { display: none; }
.sources > summary::before {
  content: "";
  width: .36rem;
  height: .36rem;
  border: solid currentColor;
  border-width: 0 1.5px 1.5px 0;
  transform: rotate(-45deg);
}
.sources[open] > summary::before { transform: rotate(45deg); }
.sources-list { display: grid; gap: .6rem; margin-top: .55rem; }
.source { padding: .68rem .82rem; border: 1px solid var(--line); background: var(--surface); border-radius: .65rem; }
.source h3 { font-size: .89rem; line-height: 1.5; }
.source-detail { margin-top: .36rem; color: var(--muted); font-size: .78rem; }
.source-excerpt {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden;
  margin-top: .28rem;
  font-size: .86rem;
}
.copy-field { display: block; width: 100%; margin-top: .5rem; padding: .45rem; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: .4rem; }

.composer-area {
  padding-block: clamp(1.1rem, 4vh, 2.8rem) max(1.1rem, env(safe-area-inset-bottom));
  border-radius: 1.8rem 1.8rem 0 0;
  background: var(--dock);
  color: var(--dock-ink);
}
.dock-inner {
  display: grid;
  grid-template-columns: minmax(0, .78fr) minmax(0, 1.67fr);
  align-items: center;
  gap: 1rem clamp(1rem, 5vw, 4.2rem);
}
.dock-intro h2 { font-size: clamp(1.35rem, 2.5vw, 2.08rem); font-weight: 720; letter-spacing: -.02em; }
.dock-intro p { margin-top: .35rem; color: var(--dock-muted); font-size: .87rem; }
.entry-dock { padding-bottom: max(1.8rem, env(safe-area-inset-bottom)); }
.entry-form { min-width: 0; }
.entry-form > label { display: block; margin-bottom: .43rem; color: var(--dock-muted); font-size: .83rem; }
.entry-input-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .58rem; }
.entry-input-row input {
  min-width: 0;
  min-height: 3.2rem;
  padding: .6rem .79rem;
  border: 1px solid #67867a;
  border-radius: .75rem;
  background: var(--dock-input);
  color: var(--dock-ink);
}
.entry-input-row input::placeholder { color: var(--dock-muted); }
.enter-button {
  min-height: 3.2rem;
  padding: .6rem .98rem;
  border: 0;
  border-radius: .75rem;
  background: #d9f1e4;
  color: var(--dock);
  font-weight: 730;
  white-space: nowrap;
}
.enter-button:hover { background: #f1faf2; }
.enter-button span { display: inline-block; margin-inline-start: .34rem; }
.chat-dock {
  padding-block: 1.08rem max(1.08rem, env(safe-area-inset-bottom));
  border-radius: 0;
  background: linear-gradient(transparent, #132e28 38%);
}
.chat-dock .content { width: min(100% - 3rem, 41rem); }
.composer {
  border: 1px solid #67867a;
  border-radius: .91rem;
  padding: .36rem;
  background: var(--dock-input);
  transform-origin: top left;
}
.composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px #a9d4c043; }
.input-row { display: flex; align-items: flex-end; gap: .35rem; }
.input-row textarea {
  flex: 1;
  min-width: 0;
  min-height: 2.7rem;
  max-height: 9rem;
  resize: none;
  border: 0;
  border-radius: .55rem;
  padding: .51rem .6rem;
  background: transparent;
  color: inherit;
  outline: 0;
  line-height: 1.6;
}
.input-row textarea::placeholder { color: #bfd7cc; }
.send-button {
  display: grid;
  place-items: center;
  width: 2.7rem;
  height: 2.7rem;
  flex: none;
  border: 0;
  border-radius: .6rem;
  background: #d9f1e4;
  color: var(--dock);
}
.send-button:hover:not(:disabled) { background: #f1faf2; }
.send-button:disabled { color: #bdd5ca; background: #375e52; }
.send-icon { display: block; position: relative; width: 1rem; height: 1rem; }
.send-icon::before, .send-icon::after { content: ""; position: absolute; }
.send-icon::before { inset: .13rem .19rem auto; aspect-ratio: 1; border: solid currentColor; border-width: 2px 0 0 2px; transform: rotate(45deg); }
.send-icon::after { inset: .16rem calc(50% - 1px) .04rem; background: currentColor; border-radius: 2px; }
.stop-icon { width: .7rem; height: .7rem; background: currentColor; border-radius: .1rem; }
.follow-up {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: .45rem;
  padding: 0 .22rem .28rem .6rem;
  border-bottom: 1px solid #64897d;
  font-size: .8rem;
  font-weight: 650;
}
.follow-up .quiet-button { color: var(--accent); }
.follow-up .quiet-button:hover { background: #2d5147; }
.form-error { padding: .2rem .55rem; color: #ffd1c9; font-size: .88rem; }
.message-error { color: #ffb4aa; font-size: .88rem; }
.composer-area :focus-visible { outline-color: var(--accent); }
.examples { display: flex; flex-wrap: wrap; gap: .36rem .42rem; margin-top: .75rem; }
.example {
  min-height: 2rem;
  border: 1px solid #54776b;
  border-radius: .48rem;
  background: transparent;
  color: var(--dock-ink);
  padding: .27rem .57rem;
  font-size: .76rem;
  line-height: 1.45;
  font-weight: 670;
}
.example:hover { border-color: var(--accent); background: #2a5144; }
.composer-foot {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: .28rem .65rem;
  margin-top: .63rem;
  color: var(--dock-muted);
  font-size: .69rem;
}
.composer-foot a { color: var(--dock-ink); white-space: nowrap; }
.in-conversation .chat-dock { padding-block: .66rem max(.55rem, env(safe-area-inset-bottom)); }
.in-conversation .chat-dock .content { width: min(100% - 3rem, 46rem); }

@media (max-width: 54rem) {
  .wide { width: calc(100% - 3.25rem); }
  .header-inner { min-height: 4.15rem; }
  .welcome-copy h1 { font-size: clamp(2.35rem, 6vw, 3.55rem); }
  .dock-intro p { font-size: .78rem; }
}

@media (max-width: 40rem) {
  .wide, .content, .chat-dock .content, .in-conversation .chat-dock .content { width: calc(100% - 1.7rem); }
  .header-inner { min-height: 3.75rem; }
  .in-chat .header-inner { min-height: 3.55rem; width: calc(100% - 1.7rem); }
  .header-actions { gap: .36rem; }
  .brand { gap: .47rem; }
  .brand-mark { width: 2.1rem; height: 2.1rem; }
  .brand strong { font-size: .94rem; }
  .brand small { margin-top: .12rem; font-size: .63rem; }
  .mode { font-size: .65rem; }
  .chat-screen { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .chat-rail {
    flex-direction: row;
    align-items: center;
    padding: .43rem .85rem;
    border-inline-end: 0;
    border-bottom: 1px solid var(--line);
  }
  .chat-rail-bottom { display: block; padding-top: 0; border: 0; }
  .profile-name { display: none; }
  .new-chat { min-height: 2.15rem; padding-inline: .48rem; }
  .chat-welcome h1 { font-size: clamp(1.74rem, 7.8vw, 2.85rem); }
  .welcome { grid-template-columns: minmax(0, 1fr); gap: 1rem; align-content: center; padding-block: 1.05rem; }
  .welcome-copy h1 { font-size: clamp(2.18rem, 9.6vw, 3.4rem); }
  .welcome-copy > p { margin-top: .65rem; font-size: .83rem; }
  .desktop-break { display: none; }
  .place img { aspect-ratio: 2.65; }
  .place figcaption { font-size: .66rem; }
  .credit { font-size: .62rem; }
  .entry-dock { border-radius: 1.35rem 1.35rem 0 0; padding-block: .85rem max(.95rem, env(safe-area-inset-bottom)); }
  .chat-dock { padding-block: .65rem max(.65rem, env(safe-area-inset-bottom)); }
  .dock-inner { display: block; }
  .dock-intro h2 { margin-bottom: .4rem; font-size: 1.1rem; }
  .dock-intro p { display: none; }
  .entry-input-row { gap: .42rem; }
  .entry-input-row input, .enter-button { min-height: 2.85rem; }
  .enter-button { padding-inline: .64rem; font-size: .82rem; }
  .examples { gap: .3rem; margin-top: .48rem; }
  .example { min-height: 1.8rem; padding: .2rem .37rem; font-size: .69rem; }
  .composer-foot { margin-top: .41rem; font-size: .62rem; }
  .conversation { padding-top: 1.1rem; gap: 1.35rem; }
  .guide-message { grid-template-columns: 1.7rem minmax(0, 1fr); gap: .48rem; }
  .guide-mark { width: 1.7rem; height: 1.7rem; }
  .message-label { margin-top: .13rem; }
  .message-content { font-size: .93rem; }
}

@media (max-width: 40rem) and (max-height: 39rem) {
  .welcome { align-content: start; }
  .place img { aspect-ratio: 3.3; }
}

@media (max-width: 32rem) {
  .answer-photos { grid-template-columns: minmax(0, 1fr); }
}
@keyframes title-arrive {
  from { opacity: 0; transform: translateY(82%); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes rise-in {
  from { opacity: 0; transform: translateY(var(--rise-distance, 9px)); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes photo-settle {
  from { transform: scale(1.055); }
  to { transform: scale(1); }
}

@keyframes activity {
  0%, 65%, 100% { opacity: .45; transform: translateY(0); }
  34% { opacity: 1; transform: translateY(-3px); }
}

@keyframes answer-caret {
  50% { opacity: .25; }
}

@media (prefers-reduced-motion: no-preference) {
  .title-line { overflow: clip; overflow-clip-margin: .08em; }
  .title-line > span { animation: title-arrive 610ms var(--motion-out) both; }
  .title-line + .title-line > span { animation-delay: 105ms; }
  .welcome-copy > p { animation: rise-in 430ms var(--motion-out) 170ms both; }
  .place { --rise-distance: 15px; animation: rise-in 660ms var(--motion-out) 105ms both; }
  .place img { animation: photo-settle 880ms var(--motion-out) both; }

  .send-button { transition: background-color 140ms ease, transform 140ms var(--motion-out); }
  .send-button:active:not(:disabled) { transform: scale(.93); }
  .example { transition: background-color 160ms ease, border-color 160ms ease, transform 160ms var(--motion-out); }
  .example:active { transform: translateY(1px); }
  .user-message { animation: rise-in 275ms var(--motion-out) both; }

  .activity-dots > span:nth-child(3) { animation-delay: 240ms; }
  .progress-caption { --rise-distance: 4px; animation: rise-in 180ms ease-out both; }
  .streaming-answer::after { animation: answer-caret 1.05s ease-in-out infinite; }
  .result-ready:not(.has-streamed) .message-content > *,
  .result-ready .answer-photos,
  .result-ready .sources,
  .result-ready .message-tools { animation: rise-in 320ms var(--motion-out) both; }

  .result-ready .answer-photos { animation-delay: 90ms; }
  .result-ready .sources, .result-ready .message-tools { animation-delay: 105ms; }
  .sources > summary::before { transition: transform 200ms var(--motion-out); }
  .sources[open] .sources-list { animation: rise-in 250ms var(--motion-out) both; }
}

@media (prefers-reduced-motion: no-preference) and (hover: hover) {

"営業時間", "何時", "郵便窓口", "窓口", "ATM", "土曜", "日曜", "駐車場"], "text": "山田郵便局は山田町川向町7-14で、駐車場は5台。通常の郵便窓口は平日9:00〜17:00で、土日祝は休み。通常のATMは平日8:45〜19:00、土日祝9:00〜18:00。"}, {"category": "産業・漁業", "source": "岩手県「漁港一覧」", "url": "https://www.pref.iwate.jp/sangyoukoyou/suisan/kibanseibi/gaiyou/1008541.html", "checked": "2026-11-20", "id": "iwate-yamada-fishing-port", "title": "山田漁港の管理者と山田湾の養殖", "keywords": ["山田漁港"], "topics": ["漁港", "管理", "漁協", "養殖", "水産", "カキ", "牡蠣", "ホタテ"], "text": "山田町中心部の山田漁港は第3種漁港で、管理者は岩手県、関係漁協は山田湾漁業協同組合。波の穏やかな山田湾ではカキやホタテの養殖が盛んと県が紹介している。"}, {"category": "産業・漁業", "source": "三陸やまだ漁業協同組合「オランダ島サーモン」", "url": "https://jf-sanrikuyamada.jp/salmon/", "checked": "2026-11-20", "id": "jf-orandajima-salmon", "title": "オランダ島サーモンの養殖と販売", "keywords": ["オランダ島サーモン"], "topics": ["養殖", "育て", "ニジマス", "出荷", "どこで買", "通販", "販売"], "text": "三陸やまだ漁協は、岩手県内陸の淡水養殖施設で育てたニジマスを11月頃に山田湾へ移し、海で約半年育てて出荷している。漁協は水揚げに合わせて直営通販「三陸やまだ産直市場」でも販売する。"}, {"category": "観光", "source": "釜揚げ屋「営業案内」", "url": "https://kamaageya.kawasai.net/", "checked": "2026-11-20", "id": "kamaageya", "title": "自家製うどん店 釜揚げ屋の所在地と営業時間", "keywords": ["釜揚げ屋", "かまあげや"], "topics": ["うどん", "住所", "どこ", "営業時間", "定休日", "何時"], "text": "釜揚げ屋は岩手県山田町山田4地割5-1にある自家製麺のうどん店。通常の営業時間は11:00〜15:00で、麺がなくなり次第閉店する。月曜日定休で、臨時休業もある。"}, {"category": "歴史・文化", "source": "山田町 文化財・地域資源管理システム「山田の神幸行事」", "url": "https://cuckoo.si.soft.iwate-pu.ac.jp/~yamada_prj/index.php?id=6&page=bunkazai_detail", "checked": "2026-11-20", "id": "yamada-jinko-ritual", "title": "山田の神幸行事と山田八幡宮・大杉神社", "keywords": ["山田の神幸行事", "山田祭り", "山田祭"], "topics": ["神幸", "指定", "文化財", "神社", "大漁", "由来", "歴史"], "text": "山田の神幸行事は山田八幡宮と大杉神社の祭礼で、神輿や郷土芸能とともに町を巡り、漁業の安全と大漁を祈る。2024年4月9日に岩手県の無形民俗文化財に指定された。"}, {"category": "地域報道", "source": "なびたび北東北「オランダ島サーモンつかみ取り初企画」", "url": "https://www.navitabi.jp/article/11049", "checked": "2026-11-20", "id": "navitabi-nigiwai-2026", "title": "2026年6月の山田にぎわい市で発表されたサーモンの企画", "keywords": ["山田にぎわい市"], "topics": ["つかみ取り", "重量当て", "初企画", "2026年6月"], "text": "なびたび北東北の2026年5月26日付の開催前報道では、同年6月7日に山田魚市場で予定されていた山田にぎわい市で、オランダ島サーモンのつかみ取りと重量当てが初めて企画されたと紹介している。"}, {"title": "ふれあいセンター「はぴね」の児童図書コーナーと利用案内", "category": "くらし", "source": "山田町「山田町ふれあいセンター『はぴね』施設紹介」", "url": "https://www.town.yamada.iwate.jp/docs/247.html", "checked": "2026-11-20", "keywords": ["はぴね", "陸中山田駅", "ふれあいセンター", "町立図書館"], "topics": ["子ども", "子供", "小学生", "親子", "雨", "屋内", "室内", "絵本", "児童", "開館", "利用時間", "休館"], "id": "md-hapine-family", "text": "山田町川向町7番24号にある無料の公共施設で、小中高生の居場所と図書館を兼ねる。館内の児童図書コーナーには小学生の教科書に出てくる本があり、小さな読書スペースもある。幼児向けのコーナーには大型絵本や紙芝居がある。\n\n基本の開館時間は火〜土曜9:00〜19:00、日曜・祝日9:00〜17:00。小学生だけで利用する場合は17:00まで。毎週月曜（祝日なら翌日）、毎月最終金曜（祝日なら前日）、12月28日〜1月4日は休館。電話は0193-82-3420。"}, {"title": "山田町まちなか交流センターの震災ギャラリー", "category": "観光", "source": "山田町「山田町まちなか交流センター」", "url": "https://www.town.yamada.iwate.jp/docs/238.html", "checked": "2026-11-20", "keywords": ["まちなか交流センター", "震災ギャラリー", "陸中山田駅"], "topics": ["展示", "見学", "震災", "無料", "屋内", "開館", "休館"], "id": "md-machinaka-gallery", "text": "山田町まちなか交流センターは川向町6番24号にある。2階の震災ギャラリーと談話コーナーは通常10:00〜17:00に無料で利用できる。\n\nセンター全体は9:00〜17:00に開館し、17:00以降の予約がある場合のみ21:00まで開館する。毎週火曜（祝日の場合は翌日）と12月29日〜1月3日は休館。問い合わせは0193-65-7028。"}, {"title": "鯨と海の科学館の館内設備と問い合わせ先", "category": "観光", "source": "鯨と海の科学館「施設情報」", "url": "https://yamada-kujirakan.jp/facility/", "checked": "2026-11-20", "keywords": ["鯨と海の科学館", "科学館", "くじら館"], "topics": ["車いす", "車椅子", "バリアフリー", "段差", "館内", "設備", "トイレ", "問い合わせ", "電話"], "id": "md-museum-visitor-facilities", "text": "鯨と海の科学館には多目的トイレと休憩スペースがある。公式の施設情報には、車いすで通れる入口や展示室までの動線、段差の有無についての記載はない。施設の問い合わせ先は0193-84-3985。"}, {"title": "山田町の町の花・木・鳥", "category": "町政情報", "source": "町の概要", "url": "https://www.town.yamada.iwate.jp/docs/408.html", "checked": "2026-11-20", "keywords": ["町の花", "町の木", "町の鳥", "町花", "町木", "町鳥", "シンボル", "ハマナス", "スギ", "ウミネコ"], "topics": ["町の花", "町の木", "町の鳥", "町花", "町木", "町鳥", "シンボル", "ハマナス", "スギ", "ウミネコ"], "id": "md-town-symbols", "text": "Q. 山田町の町の花・木・鳥は何ですか？\n\nA. 町の花はハマナス、町の木はスギ、町の鳥はウミネコです。町の概要では、いずれも昭和50年10月1日に制定されたと紹介されています。"}], "l
